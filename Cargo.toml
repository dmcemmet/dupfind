[package]
name = "dupfinder"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ratatui = { version = "0.30", features = ["crossterm_0_28"] }
crossterm = "0.28"
walkdir = "2.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rayon = "1.10"
chrono = "0.4"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
bincode = "1"
dirs = "6"
ratatui-image = { version = "10.0", default-features = false, features = ["image-defaults", "crossterm"] }
image = "0.25"

[dev-dependencies]
tempfile = "3.14"
